name: signal-scan

on:
  schedule:
    - cron: "0 * * * *"    # top of the hour  -> start a ~30-minute scanning loop
    - cron: "30 * * * *"   # half past        -> start the next ~30-minute loop
  workflow_dispatch: {}     # manual run from the Actions tab

permissions:
  contents: read

# Only one scanning loop at a time: overlapping runs would double-settle trades.
concurrency:
  group: signal-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 33
    env:
      MPLBACKEND: Agg
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Rolling cache carries the regime state + paper-trade ledger between runs.
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: |
            forex_state.json
            paper_trades.json
          key: signals-state-${{ github.run_id }}
          restore-keys: |
            signals-state-

      - name: Daily report (13:00 UTC = 21:00 Asia/Shanghai)
        if: github.event_name == 'schedule'
        run: |
          if [ "$(date -u +%H)" = "13" ]; then
            python forex_signal.py --report
          fi

      # A cron every 5 minutes is unreliable, so instead each job stays alive
      # and scans every 5 minutes itself. Two overlapping half-hour jobs give a
      # continuous 5-minute cadence with only hourly cron kicks.
      - name: Scan every 5 minutes for ~30 minutes
        run: |
          if [ ! -f forex_state.json ]; then
            python forex_signal.py --seed   # first run: seed state, no message flood
          fi
          end=$(( $(date +%s) + 1740 ))
          while [ "$(date +%s)" -lt "$end" ]; do
            python forex_signal.py || echo "scan error (continuing)"
            sleep 300
          done

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            forex_state.json
            paper_trades.json
          key: signals-state-${{ github.run_id }}
